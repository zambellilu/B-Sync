<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>B-Sync | Cadastro</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <!-- CSS geral -->
    <link rel="stylesheet" href="../assets/css/style.css">

    <!-- CSS do cadastro -->
    <link rel="stylesheet" href="../assets/css/cadastro.css">

</head>


<body class="cadastro-page">


    <main class="cadastro-screen">


        <!-- =========================
             LADO ESQUERDO
        ========================== -->

        <section class="cadastro-intro">

            <img
                src="../assets/img/login-livraria.png"
                alt="Interior da livraria"
                class="cadastro-image"
            >

            <div class="cadastro-intro-text">

                Organize Histórias<br>
                Conecte Pessoas

            </div>

        </section>


        <!-- =========================
             LADO DIREITO
        ========================== -->

        <section class="cadastro-area">

            <div class="cadastro-content">


                <!-- CABEÇALHO -->

                <div class="cadastro-header">

                    <img
                        src="../assets/img/logo.png"
                        alt="B-Sync"
                        class="cadastro-logo"
                    >

                    <h2>
                        Crie sua conta
                    </h2>

                    <p>
                        Preencha seus dados para começar.
                    </p>

                </div>


                <!-- FORMULÁRIO -->

                <form class="cadastro-form">


                    <div class="form-group">

                        <label for="nome">
                            Nome
                        </label>

                        <div class="input-wrapper">

                            <i class="bi bi-person"></i>

                            <input
                                type="text"
                                id="nome"
                                placeholder="Digite seu nome"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="email">
                            E-mail
                        </label>

                        <div class="input-wrapper">

                            <i class="bi bi-envelope"></i>

                            <input
                                type="email"
                                id="email"
                                placeholder="Digite seu e-mail"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="senha">
                            Senha
                        </label>

                        <div class="input-wrapper">

                            <i class="bi bi-lock"></i>

                            <input
                                type="password"
                                id="senha"
                                placeholder="Digite sua senha"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="confirmar-senha">
                            Confirmar senha
                        </label>

                        <div class="input-wrapper">

                            <i class="bi bi-lock"></i>

                            <input
                                type="password"
                                id="confirmar-senha"
                                placeholder="Confirme sua senha"
                                required
                            >

                        </div>

                    </div>

                    <div class="form-group">

    <label>Tipo de conta</label>

    <div class="tipo-conta">

        <label>
            <input type="radio" name="tipo-conta" value="usuario" checked>
            Usuário
        </label>

        <label>
            <input type="radio" name="tipo-conta" value="admin">
            Administrador
        </label>

    </div>

</div>

                    <button
                        type="submit"
                        class="cadastro-button"
                    >
                        Criar conta
                    </button>


                </form>


                <!-- LOGIN -->

                <p class="login-link">

                    Já possui uma conta?

                    <a href="login.html">
                        Faça login
                    </a>

                </p>


                <!-- VOLTAR -->

                <a
                    href="../index.html"
                    class="back-home"
                >

                    <i class="bi bi-arrow-left"></i>

                    Voltar para o início

                </a>


            </div>

        </section>


    </main>

    <script src="../assets/js/cadastro.js"></script>
    


</body>

</html>
